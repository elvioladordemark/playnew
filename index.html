<!DOCTYPE html>
<html>
<head>
  <title>TV</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" controls autoplay></video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.7/shaka-player.compiled.min.js"></script>
  <script>
    (async () => {
      try {
        await shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          throw new Error('Browser not supported');
        }

        const video = document.getElementById('video');
        const player = new shaka.Player(video);

        const drmConfig = {
          clearKeys: {
            '51c0ef23b17297e5c01cd7f36dd0a6ce':'8823f713ba6fdb9bbe0a2ad82d309a4b'
          }
        };

        await player.configure({
          drm: drmConfig
        });

        await player.load('https://otte.live.fly.ww.aiv-cdn.net/gru-nitro/live/clients/dash/enc/w8kwdfmlgs/out/v1/3aa321e477504937a439b602e078eb18/cenc.mpd');

        console.log('Video loaded successfully!');
      } catch (error) {
        console.error('Error loading video:', error);
      }
    })();
  </script>
</body>
</html>
